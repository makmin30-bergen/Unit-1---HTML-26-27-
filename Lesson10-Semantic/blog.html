<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Semantic Blog Page</title>
    <!-- Semantic Blog Page · graded · five landmarks, one page.
       The styles are done. A stray dot in a selector fails silently. -->
    <style>
        header {
            background: #101A2B;
            color: white;
        }

        nav {
            background: #DBEAFE;
        }

        main {
            background: #F0FDF4;
        }

        aside {
            background: #FEF3C7;
        }

        footer {
            background: #E2E8F0;
        }

        article {
            border: 2px solid #94A3B8;
            border-radius: 8px;
            padding: 6px 12px;
        }
    </style>
</head>

<body>

    <!-- 1 ▸ a header with the site title in an h1 -->
    <header>
        <h1 id="home">Sam's Blog</h1>
    </header>

    <!-- 2 ▸ a nav with three links -->
    <nav>
        <a href="#home">Home</a> · <a href="#posts">Posts</a> · <a href="#about">About</a>
    </nav>
    

    <!-- 3 ▸ one main holding two articles — each post gets an h2 and a p -->
    <main id="posts">
    <article>
        <h2>Post one</h2>
        <p>…</p>
    
    </article>

    <article>
        <h2>Post two</h2>
        <p>…</p>
    </article>
    </main>

    <!-- 4 ▸ an aside for the about box -->
    
    <aside id="about">
        <p>About me…</p>
    </aside>

    <!-- 5 ▸ a footer with the copyright -->
    <footer>
        <p>© 2026 Sam</p>
    </footer>
</body>

</html>
