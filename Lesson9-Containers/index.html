<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .highlight {
            background-color: bisque;
        }
        #site-footer {
            background-color: blueviolet;
        }
        .card{
            border: 2px solid green;
            border-radius: 8px;
        }
        #main-nav {
            background: navy;
            color: white;
        }
        .price{
            color: chartreuse;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <nav id="main-nav">...nav links...</nav>
    <p class="highlight">First Note</p>
    <p class="highlight">Second Note</p>
    <p class="highlight">Thrid Note</p>
    <p>A plane note which has no class or color</p>

    <div class="highlight">
        <h2>Product A</h2>
        <p>First product</p>
    </div>
    <div class="card">
        <h2>Product B</h2>
        <p>Second Product</p>
    </div>
    <p>The price is <span class="price">$29</span> today only!</p>
    <footer id="site-footer">
        @ 2026 CLUB SIGN-UP
    </footer>
    
</body>
</html>
